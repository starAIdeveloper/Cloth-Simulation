<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebGL Cloth Simulation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <canvas id="webgl-canvas"></canvas>

    <button id="ui-toggle-btn" class="ui-hamburger-btn hidden" title="Open Settings">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>

    <div id="ui-panel" class="ui-window">
      <div class="ui-header">
        <span class="ui-title">Cloth Simulation 3D</span>
        <div class="ui-header-right">
          <span id="ui-fps" class="ui-fps-badge">60.0 FPS</span>
          <button id="ui-close-btn" class="ui-close-btn" title="Collapse Window">✕</button>
        </div>
      </div>

      <div class="ui-content">
        <div class="ui-group">
          <div class="ui-group-title">Controls</div>
          <div class="ui-btn-row">
            <button id="btn-pause" class="ui-btn">Pause</button>
            <button id="btn-reset" class="ui-btn ui-btn-accent">Reset Cloth</button>
          </div>
        </div>

        <div class="ui-group">
          <div class="ui-group-title">Pinning</div>
          <div class="ui-row">
            <label class="ui-label">Pin Mode:</label>
            <select id="sel-pin-mode" class="ui-select">
              <option value="top-2-corners" selected>Top 2 Corners</option>
              <option value="top-edge">Top Edge</option>
              <option value="top-4-corners">4 Corners</option>
              <option value="none">Free Hanging</option>
            </select>
          </div>
        </div>

        <div class="ui-group">
          <div class="ui-group-title">Physics Parameters</div>
          
          <div class="ui-row">
            <label for="sld-gravity" class="ui-label">Gravity Y: <span id="val-gravity">-9.8</span></label>
            <input type="range" id="sld-gravity" min="-25" max="5" step="0.5" value="-9.8" class="ui-slider" />
          </div>

          <div class="ui-row">
            <label for="sld-damping" class="ui-label">Air Damping: <span id="val-damping">0.98</span></label>
            <input type="range" id="sld-damping" min="0.90" max="0.999" step="0.005" value="0.98" class="ui-slider" />
          </div>

          <div class="ui-row">
            <label for="sld-stiffness" class="ui-label">Solver Iterations: <span id="val-stiffness">12</span></label>
            <input type="range" id="sld-stiffness" min="1" max="30" step="1" value="12" class="ui-slider" />
          </div>
        </div>

        <div class="ui-group">
          <div class="ui-group-title">Wind Simulation</div>
          
          <div class="ui-row ui-checkbox-row">
            <input type="checkbox" id="chk-wind-enable" checked class="ui-checkbox" />
            <label for="chk-wind-enable" class="ui-label">Enable Wind Force</label>
          </div>

          <div class="ui-row">
            <label for="sld-wind-strength" class="ui-label">Wind Strength: <span id="val-wind-strength">12.0</span></label>
            <input type="range" id="sld-wind-strength" min="0" max="50" step="1" value="12" class="ui-slider" />
          </div>

          <div class="ui-row">
            <label for="sld-wind-angle" class="ui-label">Wind Angle: <span id="val-wind-angle">45°</span></label>
            <input type="range" id="sld-wind-angle" min="0" max="360" step="5" value="45" class="ui-slider" />
          </div>

          <div class="ui-row ui-checkbox-row">
            <input type="checkbox" id="chk-wind-turbulence" checked class="ui-checkbox" />
            <label for="chk-wind-turbulence" class="ui-label">Turbulence / Gusts</label>
          </div>
        </div>

        <div class="ui-group">
          <div class="ui-group-title">Sphere Collider</div>
          
          <div class="ui-row ui-checkbox-row">
            <input type="checkbox" id="chk-sphere-enable" checked class="ui-checkbox" />
            <label for="chk-sphere-enable" class="ui-label">Enable Sphere Collider</label>
          </div>

          <div class="ui-row">
            <label for="sld-sphere-radius" class="ui-label">Sphere Radius: <span id="val-sphere-radius">1.8</span></label>
            <input type="range" id="sld-sphere-radius" min="0.5" max="3.5" step="0.1" value="1.8" class="ui-slider" />
          </div>

          <div class="ui-row">
            <label for="sld-sphere-pos-x" class="ui-label">Position X: <span id="val-sphere-pos-x">0.0</span></label>
            <input type="range" id="sld-sphere-pos-x" min="-4" max="4" step="0.1" value="0.0" class="ui-slider" />
          </div>

          <div class="ui-row">
            <label for="sld-sphere-pos-z" class="ui-label">Position Z: <span id="val-sphere-pos-z">0.0</span></label>
            <input type="range" id="sld-sphere-pos-z" min="-4" max="4" step="0.1" value="0.0" class="ui-slider" />
          </div>
        </div>

        <div class="ui-group">
          <div class="ui-group-title">Appearance</div>
          
          <div class="ui-row">
            <label class="ui-label">Render Mode:</label>
            <select id="sel-render-mode" class="ui-select">
              <option value="solid" selected>Solid Fabric</option>
              <option value="wireframe">Wireframe Mesh</option>
            </select>
          </div>

          <div class="ui-row">
            <label class="ui-label">Cloth Color:</label>
            <input type="color" id="col-cloth" value="#4361ee" class="ui-color-picker" />
          </div>

          <div class="ui-row ui-checkbox-row">
            <input type="checkbox" id="chk-shadows" checked class="ui-checkbox" />
            <label for="chk-shadows" class="ui-label">Enable Shadows</label>
          </div>
        </div>

        <div class="ui-footer-tip">
          💡 <strong>Left Mouse:</strong> Rotate camera angle / Drag sphere.<br>
          💡 <strong>Right Mouse Drag:</strong> Blow wind force in vector direction!
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
